name: Automated Canadian Cities Scraper & Vector Ingestion

on:
  schedule:
    # Runs every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-ingest:
    name: Scrape & Ingest to Upstash Vector
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit changes back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Canadian Cities Scraper
        working-directory: packages/scraper
        env:
          UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
          UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NODE_ENV: production
        run: npm run start

      - name: Commit and push live news feed
        run: |
          git config --global user.name "Scraper Bot"
          git config --global user.email "bot@canadiancitychatbots.com"
          git add apps/web/src/data/live-news.json
          git commit -m "chore: auto-update live civic news feed [skip ci]" || echo "No changes to commit"
          git push
